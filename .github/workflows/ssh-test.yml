name: SSH Network Test

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Test TCP Port 22
        run: |
          echo "Testing 72.61.242.70:22"
          timeout 10 bash -c '</dev/tcp/72.61.242.70/22' \
            && echo "PORT 22 IS OPEN" \
            || echo "PORT 22 IS NOT REACHABLE"